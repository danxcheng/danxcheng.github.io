# ============================================================
# Hugo 站点部署到 GitHub Pages（官方推荐方式）
# 参考：https://gohugo.io/hosting-and-deployment/hosting-on-github/
#
# 重要前提（必须手动设置一次）：
#   GitHub 仓库 Settings → Pages → Source 选择 "GitHub Actions"
#   否则 GitHub 会按"从分支部署"把 main 根目录的源码直接发布，
#   与本 workflow 互相覆盖，页面时好时坏。
# ============================================================
name: Build and deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${{ runner.temp }}/hugo"
          tar -C "${{ runner.temp }}/hugo" -xzf "${{ runner.temp }}/hugo.tar.gz"
          echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo-cache
          key: hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('hugo.toml') }}
          restore-keys: |
            hugo-${{ env.HUGO_VERSION }}-

      - name: Build
        run: hugo --minify --gc --cleanDestinationDir --baseURL "${{ steps.pages.outputs.base_url }}/"
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5