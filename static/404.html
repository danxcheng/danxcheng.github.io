<!DOCTYPE html>
<!-- ============================================================
   static/404.html —— 根域 404（GitHub Pages 专用）
   ------------------------------------------------------------
   GitHub Pages 对未知路径只认"站点根目录的 404.html"。
   这里做一个轻量跳转页：0 秒后跳到 Hugo 生成的中文 404 页
   （/zh/404.html，带完整主题）。真正负责显示的是那个页面。
   ============================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>404 - Danxcheng</title>
    <meta http-equiv="refresh" content="0; url=/zh/404.html">
</head>
<body>
    <p>页面不存在，正在跳转…</p>
</body>
</html>
