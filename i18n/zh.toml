# ============================================================
# 中文界面文案（Hugo i18n 翻译表）
#
# 格式：[键名] + other = "文案"
# 模板里用 {{ i18n "键名" }} 调用，Hugo 按当前语言自动取对应文案。
# 某语言缺某个键时，会回退到默认语言的值（不会报错）。
# 参考：https://gohugo.io/functions/i18n/
# ============================================================

[nav]
other = "导航"

# 首页"最新文章"标题（首页目前是简介式，此键保留备用）
[latest_posts]
other = "最新文章"

# 文章列表为空时的提示
[no_posts]
other = "目前还没有发布任何文章。"

# 语言切换器的无障碍标签
[language_switcher]
other = "切换语言"

[prev]
other = "上一页"

[next]
other = "下一页"

[pagination]
other = "分页"

[toc]
other = "目录"

[tags]
other = "标签"

[not_found]
other = "页面不存在。"
