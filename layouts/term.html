{{- /* 单个标签页（/tags/xxx/）：列出该标签下的文章 */}}
{{ define "main" }}
    <div class="content-body">
        <h1 class="display display-article">{{ .Title }}</h1>
        <ul class="post-list">
            {{- range .Pages }}
                <li class="post-item">
                    <span class="post-date">{{ .Date.Format "2006/01/02" }}</span>
                    <a class="post-title" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
                </li>
            {{- end }}
        </ul>
    </div>
{{ end }}
