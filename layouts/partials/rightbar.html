{{- /* 右栏：文章发布时间 + 底部"组件"设置入口。
         仅文章页有日期，其余页面右栏保持对称占位；设置入口始终存在。 */}}
{{- if eq .Kind "page" }}
    {{- with .Date }}
        <time class="rightbar-date" datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006/01/02" }}</time>
    {{- end }}
{{- end }}
<button class="settings-entry" type="button" data-open-settings>&#9881; {{ i18n "settings_entry" }}</button>
